# Keeps the Psephos public record current WITHOUT the desktop app being open.
# It does only the MECHANICAL, rule-based updates:
#   - resolve finished football matches from the live fixture feed
#   - re-score, recompute error-correlation, rebuild app_data + hosted proofs/CSVs
#   - verify the record's integrity (ledger<->payload reconciliation + golden math test)
#   - commit the updated record and redeploy the public site
# Judgment-heavy steps (admitting polls, reading tripwires, writing NEW forecasts,
# resolving elections on AP-style calls, anchoring new manifests) are deliberately
# NOT here - those stay with the weekly Claude desktop autopilot.
#
# When it publishes:
#   - DAILY run: only if a match actually resolved (no cosmetic date churn otherwise).
#   - WEEKLY run (Mon): ALWAYS rebuilds + redeploys, so a missed desktop Monday still
#     refreshes the public site. If the desktop task already ran that day the rebuild is
#     byte-identical and produces no commit, so this stays a true no-churn backstop.
#   - Manual run with force=true: same as the weekly refresh, on demand.
# Integrity gates (verify_ledger + golden test) run on EVERY trigger and fail the job
# if the record ever drifts - an always-on monitor, visible as a red run in Actions.
name: Psephos autopilot (mechanical)

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC (~11:30 IST): resolve matches; publish only if one resolved
    - cron: "0 16 * * 1"  # weekly Mon 16:00 UTC (~21:30 IST): refresh + redeploy the site regardless
  workflow_dispatch:
    inputs:
      force:
        description: "Force a full rebuild + redeploy even if nothing resolved"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: psephos-autopilot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pandas numpy

      - name: Resolve finished matches from the live feed
        run: python src/scoring/epl_resolve.py || echo "resolve skipped (feed unreachable this run)"

      - name: Integrity gate (always) - verify the record and the math
        run: |
          set -e
          python src/scoring/verify_ledger.py
          python src/tests/test_golden.py

      - name: Did a match actually resolve?
        id: changed
        run: |
          if git diff --quiet -- forecasts/matches_ledger.csv; then
            echo "substantive=false" >> "$GITHUB_OUTPUT"
          else
            echo "substantive=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to publish
        id: pub
        run: |
          if [ "${{ steps.changed.outputs.substantive }}" = "true" ] \
             || [ "${{ github.event.schedule }}" = "0 16 * * 1" ] \
             || [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing: match resolved, weekly refresh, or forced."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Daily run, nothing resolved - skipping rebuild/commit/deploy (no cosmetic churn)."
          fi

      - name: Re-score, recompute correlation, rebuild the app
        if: steps.pub.outputs.publish == 'true'
        run: |
          set -e
          python src/scoring/score.py
          python src/pipeline/15_error_correlation.py
          python src/webbuild/13_build_app_data.py
          cp site/app_data.json site/app/app_data.json
          cp data/processed/scores.csv site/app/scores.csv
          cp data/processed/scores.csv site/scores.csv

      - name: Commit the updated record (only if anything actually changed)
        if: steps.pub.outputs.publish == 'true'
        run: |
          git config user.name "psephos-autopilot[bot]"
          git config user.email "psephos-autopilot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed (e.g. the desktop task already refreshed today) - no commit."
          else
            git commit -m "autopilot: mechanical refresh (resolve/score/rebuild) [skip ci]"
            git push
          fi

      - name: Configure Pages
        if: steps.pub.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - name: Upload the site
        if: steps.pub.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/app
      - name: Deploy to GitHub Pages
        if: steps.pub.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
